<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>循環經濟實作平台</title>
<meta name="description" content="ISO 59004 循環經濟報告書分組練習平台（Google Sheet 資料庫版）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面概念：淡紫灰底上的白色圓角卡片；頂部導覽列＋問候列，專案頁以膠囊分頁串起報告書 13 個步驟 */
:root {
  --bg: #EAF0F8; --surface: #FFFFFF; --surface-2: #F3F7FC; --line: #DCE5F1; --fg: #142238; --muted: #5A6B85;
  --accent: #1E5EEB; --accent-ink: #FFFFFF; --accent-soft: #E3EDFF;
  --good: #187A55; --good-soft: #DDF4E9; --warn: #9A5B00; --warn-soft: #FFF0D4; --bad: #C92F2F; --bad-soft: #FDE3E3;
  --info: #0B7A8A; --info-soft: #DDF3F6; --chg: #FFF3C9;
  --ser-b: #2A9D8F; --ser-d: #1E5EEB;
  --ring: #E6E6EE; --c-base: #6F819C; --c-con: #E9A800; --c-use: #23A047; --c-end: #1798AC; --c-ci: #2F6FE0; --on-stage: #FFFFFF;
  --shadow: 0 1px 2px rgba(20, 50, 100, .05), 0 8px 24px rgba(20, 50, 100, .06);
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C121D; --surface: #152033; --surface-2: #1C2A42; --line: #2A3A55; --fg: #E8EEF8; --muted: #9DB0CC;
  --accent: #6AA2FF; --accent-ink: #0B1730; --accent-soft: #17305A;
  --good: #4FD19B; --good-soft: #163729; --warn: #F2B14B; --warn-soft: #3A2C12; --bad: #FF7A7A; --bad-soft: #3D1D23;
  --info: #4FC7D6; --info-soft: #12333A; --chg: #4A3F14; --ser-b: #36A596; --ser-d: #5B95FF; --ring: #2B3A52; --c-base: #4E6080; --c-con: #F2B63D; --c-use: #43C068; --c-end: #35BCD0; --c-ci: #6F9DFF; --on-stage: #0C1424;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C121D; --surface: #152033; --surface-2: #1C2A42; --line: #2A3A55; --fg: #E8EEF8; --muted: #9DB0CC;
  --accent: #6AA2FF; --accent-ink: #0B1730; --accent-soft: #17305A;
  --good: #4FD19B; --good-soft: #163729; --warn: #F2B14B; --warn-soft: #3A2C12; --bad: #FF7A7A; --bad-soft: #3D1D23;
  --info: #4FC7D6; --info-soft: #12333A; --chg: #4A3F14; --ser-b: #36A596; --ser-d: #5B95FF; --ring: #2B3A52; --c-base: #4E6080; --c-con: #F2B63D; --c-use: #43C068; --c-end: #35BCD0; --c-ci: #6F9DFF; --on-stage: #0C1424;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
#app { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 48px; display: flex; flex-direction: column; gap: 16px; }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 24px; font-weight: 900; letter-spacing: .01em; }
h2 { font-size: 19px; font-weight: 900; }
h3 { font-size: 16px; font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sub { color: var(--muted); margin: 4px 0 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; min-height: 36px; max-width: 100%; }
select { padding-right: 26px; }
input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
label.ck { flex-direction: row; align-items: center; gap: 8px; color: var(--fg); }
/* top bar */
.topbar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; flex-wrap: wrap; }
.brand { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 900; font-size: 22px; flex: none; }
.brand-lg { width: 64px; height: 64px; font-size: 28px; }
.mainnav { display: flex; gap: 6px; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; border-radius: 16px; padding: 8px 14px; color: var(--muted); font-size: 13px; font-weight: 500; }
.nav-btn.on { background: var(--accent-soft); color: var(--accent); }
.nav-btn:hover { color: var(--accent); }
.top-r { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 14px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; white-space: nowrap; }
.pill-btn:hover { border-color: var(--accent); }
.pill-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }
.pill-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.banner { background: var(--bad-soft); color: var(--bad); border-radius: var(--r-md); padding: 10px 16px; font-weight: 500; }
.banner-soft { background: var(--warn-soft); color: var(--warn); }
/* hello + kpis */
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-inline: 4px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.kpi { display: flex; gap: 16px; align-items: flex-start; padding: 22px; }
.kpi-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.tone-info { background: var(--info-soft); color: var(--info); } .tone-accent { background: var(--accent-soft); color: var(--accent); }
.tone-good { background: var(--good-soft); color: var(--good); } .tone-warn { background: var(--warn-soft); color: var(--warn); }
.kpi-l { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi-v { font-size: 28px; font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi-s { font-size: 12px; color: var(--muted); }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 18px 20px; }
.filters .hint { flex-basis: 100%; }
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 16px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; min-height: 38px; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn-accent:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.08); }
.btn-danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn-danger:hover:not(:disabled) { color: #fff; filter: brightness(1.05); }
.btn-sm { padding: 5px 12px; min-height: 32px; font-size: 13px; }
.btn-lg { padding: 12px 20px; font-size: 16px; justify-content: center; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; padding: 0; }
.x { border: 0; background: var(--surface-2); color: var(--muted); width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; }
.x:hover { background: var(--bad-soft); color: var(--bad); }
/* project grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.pcard { padding: 20px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; border: 2px solid transparent; transition: border-color .15s; }
.pcard:hover { border-color: var(--accent-soft); }
.pc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; }
.members { display: flex; gap: 6px; flex-wrap: wrap; }
.mchip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12px; }
.mchip b { font-weight: 700; } .mchip i { font-style: normal; color: var(--muted); padding-right: 6px; }
.mchip .x { width: 20px; height: 20px; font-size: 13px; }
.sdots { display: flex; gap: 4px; align-items: center; }
.sdots .sl { width: 64px; font-size: 12px; color: var(--muted); flex: none; }
.sdots .mono { margin-left: 6px; font-size: 12px; color: var(--muted); }
.sd { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; flex: none; }
.sd-done { background: var(--good); } .sd-doing { background: var(--warn); }
.pc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.pc-stats > div { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.pc-stats b { font-size: 16px; }
.empty { padding: 32px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.panel { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.formrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: end; }
.formgrid .mpick, .formgrid .formbtns { grid-column: 1 / -1; }
.mpick { border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.mpick legend { color: var(--muted); font-size: 13px; padding: 0 6px; }
.mrow { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.formbtns { display: flex; gap: 8px; }
/* login */
.login { min-height: 80vh; display: grid; place-items: center; }
.login-card { width: min(420px, 100%); padding: 32px 28px; display: flex; flex-direction: column; gap: 14px; }
.login-form { display: flex; flex-direction: column; gap: 12px; }
.login-form input { min-height: 44px; }
.err { color: var(--bad); margin: 0; min-height: 1.2em; font-weight: 500; }
/* project head */
.phead { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
.ph-top { display: flex; justify-content: space-between; align-items: center; }
.save { font-size: 12px; color: var(--good); background: var(--good-soft); border-radius: 999px; padding: 3px 10px; font-weight: 500; }
.save[data-busy="1"] { color: var(--warn); background: var(--warn-soft); }
.ph-main { display: flex; gap: 20px; justify-content: space-between; flex-wrap: wrap; }
.ph-title { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 320px; align-items: flex-start; }
.title-in { font-size: 22px; font-weight: 900; border: 1px solid transparent; padding: 2px 8px; margin-left: -8px; width: 100%; background: transparent; }
.title-in:hover, .title-in:focus { border-color: var(--line); background: var(--surface); }
.ph-stats { display: flex; gap: 12px; flex-wrap: wrap; }
.st { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; min-width: 180px; align-items: flex-start; }
.st b { font-size: 20px; }
.st .muted { font-size: 12px; }
.admintools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
.warn-t { color: var(--bad); font-weight: 500; }
.steps { display: flex; gap: 6px; overflow-x: auto; background: var(--surface); border-radius: 999px; padding: 6px; box-shadow: var(--shadow); scrollbar-width: thin; }
.stab { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; border-radius: 999px; padding: 9px 14px; font-weight: 700; color: var(--fg); white-space: nowrap; }
.stab .mono { color: var(--muted); font-size: 12px; }
.stab:hover { background: var(--surface-2); }
.stab.on { background: var(--accent); color: var(--accent-ink); }
.stab.on .mono { color: inherit; opacity: .8; }
.stab.on .sd { outline: 2px solid var(--accent-ink); }
.badge { background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 6px; font-family: var(--f-mono); }
.stepcard { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.st-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.st-head h2 .mono { color: var(--accent); margin-right: 4px; }
.taskbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 18px; background: var(--surface-2); border-radius: var(--r-md); padding: 14px 16px; font-size: 13px; }
.taskbox > div { display: flex; flex-direction: column; gap: 2px; }
.tb-l { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.sec { margin-top: 6px; font-size: 15px; }
.stepnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.actrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); max-width: 100%; }
/* 寬表格：表格上方固定顯示捲軸與提醒（macOS 預設會隱藏捲軸，這裡強制顯示） */
.xbar { position: sticky; top: 0; z-index: 3; background: var(--surface); padding: 6px 0 4px; display: flex; flex-direction: column; gap: 4px; }
.xbar-t { font-size: 13px; font-weight: 600; color: var(--warn); }
.xbar-t b { font-weight: 700; }
.xbar-r { display: flex; align-items: center; gap: 8px; }
.xbar-b { flex: none; min-height: 28px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--fg); }
.xbar-b:disabled { opacity: .35; }
.xbar-s { position: relative; flex: 1; height: 14px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; touch-action: none; }
.xbar-k { position: absolute; top: 1px; bottom: 1px; left: 0; border-radius: 6px; background: #7F93B2; cursor: grab; }
.xbar-k:active { cursor: grabbing; background: #5D7396; }
.tbl-wrap::-webkit-scrollbar { height: 12px; }
.tbl-wrap::-webkit-scrollbar-track { background: var(--surface-2); border-radius: 6px; }
.tbl-wrap::-webkit-scrollbar-thumb { background: #8EA0BA; border-radius: 6px; border: 2px solid var(--surface-2); }
.tbl-wrap.xmore { box-shadow: inset -14px 0 12px -10px rgba(20, 34, 56, .28); }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl thead th { background: var(--surface-2); font-weight: 700; color: var(--muted); font-size: 12px; white-space: nowrap; position: sticky; top: 0; }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.tbl .rowh { font-weight: 700; color: var(--fg); background: transparent; white-space: nowrap; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl .auto { color: var(--muted); white-space: nowrap; }
.tbl tr.adopted td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tbl tr.total > * { background: var(--accent-soft); font-weight: 700; }
.tbl tr.sum > * { background: var(--surface-2); font-weight: 700; }
.tbl tr.grp td { background: var(--surface-2); font-weight: 700; }
.tbl tr.custom td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.t-mat td { white-space: nowrap; } .t-mat td.w-src { white-space: normal; }
.tbl td.chg { background: var(--chg); font-weight: 600; }
.tbl.kv th { width: 160px; }
.tbl select, .tbl input { min-height: 32px; padding: 4px 8px; font-size: 13px; }
.tbl select { padding-right: 22px; max-width: 260px; }
.w-xs { width: 78px; } .w-sm { width: 110px; } .w-num { width: 110px; } .w-l { max-width: 300px; min-width: 180px; } .w-xl { min-width: 240px; max-width: 380px !important; } .w-full { width: 100%; max-width: 100% !important; }
.w-prac { min-width: 220px; max-width: 300px !important; }
.w-name { min-width: 200px; } .w-src { min-width: 200px; white-space: normal !important; } .w-act { min-width: 120px; }
.tbl input.w-xl, .tbl input.w-l { width: 260px; }
.pin { display: inline-flex; align-items: center; gap: 4px; } .pin i { font-style: normal; color: var(--muted); font-size: 12px; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip-good { background: var(--good-soft); color: var(--good); } .chip-bad { background: var(--bad-soft); color: var(--bad); }
.chip-mute { background: var(--surface-2); color: var(--muted); } .chip-accent { background: var(--accent-soft); color: var(--accent); }
.t-bad { color: var(--bad); }
.mini-kpis { display: flex; gap: 10px; flex-wrap: wrap; }
.mini-kpis > div { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 16px; min-width: 120px; }
.mini-kpis b { font-size: 20px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.two > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.concl { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; max-width: 80ch; }
/* charts */
.hero-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.hero { background: var(--surface-2); border-radius: var(--r-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.big { font-size: 32px; font-weight: 900; line-height: 1.15; }
.meter { position: relative; height: 12px; border-radius: 6px; background: var(--line); margin: 18px 0 6px; }
.meter-f { position: absolute; inset: 0 auto 0 0; background: var(--ser-d); border-radius: 6px; }
.meter-t { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--fg); }
.meter-t span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; margin-bottom: 1px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
.bar-l { color: var(--fg); font-size: 12px; font-weight: 500; }
.bar-t { position: relative; height: 14px; display: block; }
.bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-d { background: var(--ser-d); } .bar-b { background: var(--ser-b); }
.bar-v { font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg-b { background: var(--ser-b); } .lg-d { background: var(--ser-d); }
.pairs { display: flex; flex-direction: column; gap: 10px; }
.pair { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; }
.pair-total { border-top: 1px dashed var(--line); padding-top: 8px; }
.pair-total .bar-l { font-weight: 900; }
.pbars { display: flex; flex-direction: column; gap: 2px; }
.bar-row2 { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; }
.bar-row2 .bar-t { height: 11px; }

/* v2：自由輸入、提示、複選、組織圖、路線圖 */
textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; width: 100%; min-height: 96px; resize: vertical; line-height: 1.6; }
textarea:disabled { background: var(--surface-2); color: var(--muted); }

.tree > li::before, .tree > li::after { display: none; }

/* ---------- 首頁 ---------- */

  <section class="kpis">
    ${kpi("folder", "info", isAdmin() ? "全部專案" : "我的專案", all.length, isAdmin() ? "管理員可看全部" : "只顯示你參與的專案")}

    ${isAdmin() ? `<select id="f_user" data-ui="filterUser" aria-label="篩選成員"><option value="">全部成員</option>${Object.values(S.users).map(x => `<option value="${esc(x.account)}"${x.account === S.ui.filterUser ? " selected" : ""}>${esc(x.name)}（${esc(x.account)}）</option>`).join("")}</select>` : ""}

    <p class="hint">點專案卡片進入步驟作業。每個專案選定四個案例之一（辦公大樓、住宅大樓、學校、棒球場），需求組與設計施工組分軌作業、互相連動。</p>
  </section>
  ${S.ui.newProj ? newProjPanel() : ""}
  <section class="pgrid">${list.length ? list.map(projCard).join("") : `<div class="card empty"><h3>還沒有專案</h3><p>按「新增專案」選一個案例開始。${isAdmin() ? "管理員也可以先到「帳號權限」建立學員帳號。" : ""}</p></div>`}</section>`;

}

}

/* ---------- 專案頁 ---------- */
function projectView() {
  const p = cur(); if (!p || !validP(p) || !(isAdmin() || isMember(p) || p.example)) { S.view = "home"; return homeView(); }
  const R = calc(p), C = D.cases[p.caseId];
  const req = S.ui.track === "req", steps = req ? STEPS_REQ : STEPS, st = req ? R.statusReq : R.status;
  if (S.step > steps.length) S.step = 0;
  const isRep = S.step === steps.length;   // D｜報告書
  const ro = !canEditSide(p, req ? "req" : "tb"), titleRo = !canEdit(p);
  const warn8 = R.rows.filter(o => o.adopt === "Y" && o.check !== "✓").length;
  const fail = R.checks.filter(c => !c.ok).length, last = STEPS.length - 1;
  const tabArr = steps.map((s, i) => {
    const badge = !req && i === 7 && warn8 ? `<span class="badge">${warn8}</span>` : !req && i === last && fail && st[last] !== "todo" ? `<span class="badge">${fail}</span>` : "";
    return `<button class="stab${S.step === i ? " on" : ""}" data-act="step" data-i="${i}"><i class="sd sd-${st[i]}"></i><span class="mono">${s.k}</span>${esc(s.t)}${badge}</button>`;
  });
  tabArr.push(`<button class="stab${isRep ? " on" : ""}" data-act="step" data-i="${steps.length}">${ic("out", 14)}報告書</button>`);
  const secs = SECS[req ? "req" : "tb"], curSec = secs.find(x => S.step >= x[3] && S.step <= x[4]) || secs[0];
  const tabs = secs.map(([id, lab, , a, b]) => `<div class="sgrp sec-${id}"><span class="sg-l">${id}｜${esc(lab)}</span><div class="sg-tabs">${tabArr.slice(a, b + 1).join("")}</div></div>`).join("");
  const seg = `<div class="seg seg-track" role="group" aria-label="切換組別">
      <button class="${req ? "on" : ""}" data-act="track" data-v="req">需求組（機關）<span class="mono">${R.nDoneReq}/${STEPS_REQ.length}</span></button>
      <button class="${!req ? "on" : ""}" data-act="track" data-v="tb">設計施工組（統包）<span class="mono">${R.nDone}/${STEPS.length}</span></button></div>`;
  const g = grpOf(p);

/* 循環經濟小組組織架構圖（樹狀，連線以 CSS 繪製，節點置中對齊） */
function orgChart(title, sub, T, tb) {
  const ok = T.filter(x => !blank(x.unit) || !blank(x.role) || !blank(x.duty));
  if (!ok.length) return `<p class="hint">輸入小組成員後，這裡會自動畫出組織架構圖。</p>`;
  const nm = x => tb ? `${esc(x.unit || "（未填單位）")}${x.dept ? `<span class="ob-u">${esc(x.dept)}</span>` : ""}` : esc(x.unit || "（未填科室）");
  const box = (x, cls = "") => `<div class="ob ${cls}"><span class="ob-r">${esc(x.role || "（未選職位）")}</span><b>${nm(x)}</b>${x.duty ? `<span class="ob-d">${esc(x.duty)}</span>` : ""}</div>`;
  const li = (inner, kids = "") => `<li>${inner}${kids ? `<ul>${kids}</ul>` : ""}</li>`;
  const by = r => ok.filter(x => x.role === r);
  const lead = by("召集人"), vice = by("副召集人"), sec = by("執行秘書"), adv = by("顧問");
  const mem = ok.filter(x => !["召集人", "副召集人", "執行秘書", "顧問"].includes(x.role));
  // 成員層：設計施工組依公司分組；需求組各科室並列
  let memLis = "";
  if (tb) { const g = {}; mem.forEach(x => { const k = x.unit || "（未填單位）"; (g[k] = g[k] || []).push(x); });
    memLis = Object.entries(g).map(([u, xs]) => xs.length === 1 ? li(box(xs[0])) : li(`<div class="ob ob-grp"><b>${esc(u)}</b><span class="ob-d">${xs.length} 位成員</span></div>`, xs.map(x => li(box(Object.assign({}, x, { unit: x.dept || x.unit, dept: x.dept ? "" : "" })))).join(""))).join("");
  } else memLis = mem.map(x => li(box(x))).join("");
  // 幕僚層：副召集人、執行秘書並排成一個節點，成員掛在其下
  const staff = vice.concat(sec);
  const staffNode = staff.length ? `<div class="ob-row${staff.length > 1 ? " multi" : ""}">${staff.map(x => box(x, x.role === "副召集人" ? "ob-mid" : "ob-sec")).join("")}</div>` : "";
  let under = staffNode ? li(staffNode, memLis) : memLis;
  if (adv.length) under = adv.map(x => li(box(x, "ob-adv"))).join("") + under;
  const leadNode = lead.length ? `<div class="ob-row${lead.length > 1 ? " multi" : ""}">${lead.map(x => box(x, "ob-lead")).join("")}</div>` : `<div class="ob ob-miss">⚠ 尚未指定召集人</div>`;
  return `<div class="org" role="img" aria-label="${esc(title)}組織架構圖"><ul class="tree">${li(`<div class="org-title">${esc(title)}<span>${esc(sub)}</span></div>`, li(leadNode, under))}</ul></div>
    <p class="hint">架構：召集人 → ${staff.length ? "副召集人／執行秘書 → " : ""}小組成員${tb ? "（同一公司的成員歸在同一組）" : ""}${adv.length ? "；顧問以虛線框列在召集人下方左側" : ""}。</p>`;
}
/* 路線圖趨勢圖：需求組（虛線）與設計施工組（實線），並標出目前設計計算值 */
function roadChart(R, showTb) {
  const W = 680, H = 280, L = 48, RR = 24, T = 24, B = 50, q = R.rroad, t = R.troad;
  const cp = R.eff.pct * 100, cc = R.ci.des * 100;
  const only = showTb === "only";
  const vals = [...(only ? [] : q), ...(showTb ? t : [])].flatMap(r => [r.pct, r.ci]).filter(v => v !== null && isFinite(v));
  const ymax = Math.max(10, Math.ceil(Math.max(30, ...vals, ...(only ? [] : [cp, cc])) / 10) * 10);
  const x = i => L + (W - L - RR) * (i + 0.5) / 3, y = v => T + (H - T - B) * (1 - Math.min(v, ymax) / ymax);
  let g = "";
  for (let v = 0; v <= ymax; v += ymax > 60 ? 20 : 10) g += `<line x1="${L}" x2="${W - RR}" y1="${y(v)}" y2="${y(v)}" class="rc-grid"/><text x="${L - 8}" y="${y(v)}" class="rc-ax" text-anchor="end" dominant-baseline="central">${v}%</text>`;
  [0, 1, 2].forEach(i => { const yr = (showTb && t[i].year) || q[i].year; g += `<text x="${x(i)}" y="${H - B + 20}" class="rc-ax" text-anchor="middle">${["短程", "中程", "長程"][i]}${yr ? `　${esc(yr)} 年` : ""}</text>`; });
  const series = only ? [] : [[q, "pct", "acc", true, "需求組 產值目標"], [q, "ci", "ci", true, "需求組 循環度目標"]];
  if (showTb) series.push([t, "pct", "acc", false, "設計施工組 產值目標"], [t, "ci", "ci", false, "設計施工組 循環度目標"]);
  series.forEach(([rows, k, tone, dash]) => {
    const pts = rows.map((r, i) => r[k] === null ? null : [x(i), y(r[k]), r[k]]).filter(Boolean);
    if (!pts.length) return;
    g += `<polyline points="${pts.map(p => p[0] + "," + p[1]).join(" ")}" class="rc-l rc-${tone}${dash ? " rc-dash" : ""}"/>`;
    g += pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${dash ? 4 : 5}" class="rc-p rc-${tone}${dash ? " rc-hollow" : ""}"/><text x="${p[0] + (dash ? -8 : 8)}" y="${p[1] - 9}" text-anchor="${dash ? "end" : "start"}" class="rc-v rc-t${tone}">${+Number(p[2]).toFixed(1)}%</text>`).join("");
  });
  const now = only ? "" : [[cp, "acc"], [cc, "ci"]].map(([v, tone]) => `<rect x="${x(0) - 5}" y="${y(v) - 5}" width="10" height="10" transform="rotate(45 ${x(0)} ${y(v)})" class="rc-now rc-${tone}"/>`).join("");
  const lg = `<div class="legend rc-legend"><span><i class="lgl lgl-acc"></i>產值（循環經濟規模）</span><span><i class="lgl lgl-ci"></i>循環度 CI</span>${only ? `<span><i class="lgl lgl-solid"></i>公司目標</span>` : `<span><i class="lgl lgl-dash"></i>需求組目標</span>${showTb ? `<span><i class="lgl lgl-solid"></i>設計施工組（公司）目標</span>` : ""}<span><i class="lgd"></i>目前設計計算值（產值 ${pc(R.eff.pct, 1)}・CI ${f3(R.ci.des)}）</span>`}</div>`;

/* 綠色材料參數：08 類型為「綠色材料」的作法，可自行設定影響的材料類別與參數 */
function greenBlock(R, ro) {
  const d = R.d, G = R.greenRows, pcols = D.pcols;

  const rows = G.map((o, gi) => {

/* 循環度總結成果（版面同 V08 總結成果顯示：基本資料、營造／使用／拆除三階段、全階段 CI） */
function donut(v, tone, size = 92, big = false) {
  const r = 40, C = 2 * Math.PI * r, f = Math.max(0, Math.min(1, Number(v) || 0));
  return `<svg class="donut${big ? " donut-big" : ""}" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${pc(v, 1)}">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ring)" stroke-width="${big ? 16 : 14}"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--c-${tone})" stroke-width="${big ? 16 : 14}" stroke-dasharray="${(f * C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 50 50)"/>
    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="var(--fg)" font-size="${big ? 15 : 14}" font-weight="700" font-family="var(--f-mono)">${pc(v, 1)}</text></svg>`;
}

/* ===== 報告書匯出：同一份內容模型 → 畫面預覽／HTML／Word（.docx） =====

const RP_FONT = '"DFKai-SB","BiauKai","標楷體","KaiTi","STKaiti",serif';

/* ---------- 黑白圖表（SVG，全部 inline 屬性，可直接轉 PNG） ---------- */
const sx = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const txtS = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 14}" ${o.b ? 'font-weight="bold"' : ""} fill="${o.fill || "#000"}" text-anchor="${o.a || "middle"}" ${o.base ? `dominant-baseline="${o.base}"` : ""}>${sx(s)}</text>`;

/* 組織架構圖：召集人 → 副召集人／執行秘書 → 成員（設計施工組依公司分組），顧問虛線 */
function svgOrg(title, sub, T, tb) {

  if (!ok.length) return null;
  const BW = 176, BH = 92, GX = 18, GY = 46;

  const lead = by("召集人"), staff = by("副召集人").concat(by("執行秘書")), adv = by("顧問");
  const mem = ok.filter(x => !["召集人", "副召集人", "執行秘書", "顧問"].includes(x.role));
  if (tb) mem.sort((a, b) => String(a.unit).localeCompare(String(b.unit)));

    g += `<line x1="${Math.min(ux, ...xs)}" y1="${busY}" x2="${Math.max(ux, ...xs)}" y2="${busY}" stroke="#000" stroke-width="1.4"/>`;
    dn.forEach((p, i) => { g += `<line x1="${xs[i]}" y1="${busY}" x2="${xs[i]}" y2="${p.y}" stroke="#000" stroke-width="1.4" ${p.n.role === "顧問" ? 'stroke-dasharray="5 4"' : ""}/>`; });
  }
  pos.forEach(r => r.forEach(({ n, x, y }) => {
    const cx = x + BW / 2;
    if (n.title) { g += `<rect x="${x - 40}" y="${y}" width="${BW + 80}" height="${BH}" fill="#000"/>` + wrapT(title, 15, 2).map((l, i) => txtS(cx, y + 30 + i * 22, l, { fs: 16, b: 1, fill: "#fff" })).join("") + txtS(cx, y + BH - 12, sub, { fs: 12, fill: "#fff" }); return; }
    if (n.miss) { g += `<rect x="${x}" y="${y}" width="${BW}" height="${BH}" fill="#fff" stroke="#000" stroke-dasharray="4 3"/>` + txtS(cx, y + BH / 2 + 5, "尚未指定召集人", { fs: 14 }); return; }
    const lead = n.role === "召集人", sw = lead ? 2.6 : n.role === "副召集人" || n.role === "執行秘書" ? 1.8 : 1.1;
    g += `<rect x="${x}" y="${y}" width="${BW}" height="${BH}" fill="${lead ? "#ececec" : "#fff"}" stroke="#000" stroke-width="${sw}" ${n.role === "顧問" ? 'stroke-dasharray="5 4"' : ""}/>`;
    g += txtS(cx, y + 18, n.role || "（未選職位）", { fs: 12 });
    const nm = tb ? `${n.unit || ""}${n.dept ? "／" + n.dept : ""}` : (n.unit || "");
    wrapT(nm || "（未填）", 12, 2).forEach((l, i) => { g += txtS(cx, y + 38 + i * 17, l, { fs: 14, b: 1 }); });
    const used = wrapT(nm || "（未填）", 12, 2).length;
    wrapT(n.duty, 13, used > 1 ? 1 : 2).forEach((l, i) => { g += txtS(cx, y + 38 + used * 17 + 4 + i * 15, l, { fs: 11.5, fill: "#333" }); });
  }));
  return { svg: svgOpen(W, H) + g + "</svg>", w: W, h: H };
}

/* 路線圖：需求組虛線、設計施工組實線；產值圓點、循環度方點；◇ 為目前設計計算值 */
function svgRoad(R) {
  const W = 760, H = 380, L = 64, RR = 30, T = 30, B = 96, q = R.rroad, t = R.troad, showTb = t.some(r => r.ok);
  const cp = R.eff.pct * 100, cc = R.ci.des * 100;
  const vals = [...q, ...(showTb ? t : [])].flatMap(r => [r.pct, r.ci]).filter(v => v !== null && isFinite(v));
  if (!vals.length) return null;
  const ymax = Math.max(10, Math.ceil(Math.max(30, ...vals, cp, cc) / 10) * 10);
  const x = i => L + (W - L - RR) * (i + 0.5) / 3, y = v => T + (H - T - B) * (1 - Math.min(v, ymax) / ymax);
  let g = "";

  g += `<line x1="${L}" x2="${W - RR}" y1="${y(0)}" y2="${y(0)}" stroke="#000"/>`;
  [0, 1, 2].forEach(i => { const yr = (showTb && t[i].year) || q[i].year; g += txtS(x(i), H - B + 24, `${["短程", "中程", "長程"][i]}${yr ? "（" + yr + " 年）" : ""}`, { fs: 14 }); });
  const series = [[q, "pct", true, "c"], [q, "ci", true, "s"]];
  if (showTb) series.push([t, "pct", false, "c"], [t, "ci", false, "s"]);
  series.forEach(([rows, k, dash, mk]) => {
    const pts = rows.map((r, i) => r[k] === null ? null : [x(i), y(r[k]), r[k]]).filter(Boolean); if (!pts.length) return;

    pts.forEach(p => {
      g += mk === "c" ? `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${dash ? "#fff" : "#000"}" stroke="#000" stroke-width="1.6"/>` : `<rect x="${p[0] - 5}" y="${p[1] - 5}" width="10" height="10" fill="${dash ? "#fff" : "#555"}" stroke="#555" stroke-width="1.6"/>`;
      g += txtS(p[0] + (dash ? -9 : 9), p[1] - 9, +Number(p[2]).toFixed(1) + "%", { fs: 12, a: dash ? "end" : "start" });
    });

  [[cp], [cc]].forEach(([v]) => { g += `<rect x="${x(0) - 30 - 6}" y="${y(v) - 6}" width="12" height="12" transform="rotate(45 ${x(0) - 30} ${y(v)})" fill="#fff" stroke="#000" stroke-width="1.4"/>`; });
  // 圖例
  const ly = H - 42, items = [["line", "#000", true, "c", "需求組 產值目標"], ["line", "#555", true, "s", "需求組 循環度目標"]];
  if (showTb) items.push(["line", "#000", false, "c", "設計施工組 產值目標"], ["line", "#555", false, "s", "設計施工組 循環度目標"]);
  items.push(["dia", "", "", "", `目前設計計算值（產值 ${pc(R.eff.pct, 1)}、CI ${f3(R.ci.des)}）`]);
  let lx = L, row = 0;
  items.forEach(([kind, col, dash, mk, lab]) => {
    const wv = 34 + tw(lab) * 12.5 + 18; if (lx + wv > W - 10) { lx = L; row++; }
    const yy = ly + row * 22;
    if (kind === "line") g += `<line x1="${lx}" x2="${lx + 26}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="2.4" ${dash ? 'stroke-dasharray="6 4"' : ""}/>` + (mk === "c" ? `<circle cx="${lx + 13}" cy="${yy}" r="4" fill="${dash ? "#fff" : "#000"}" stroke="#000"/>` : `<rect x="${lx + 9}" y="${yy - 4}" width="8" height="8" fill="${dash ? "#fff" : "#555"}" stroke="#555"/>`);
    else g += `<rect x="${lx + 8}" y="${yy - 5}" width="10" height="10" transform="rotate(45 ${lx + 13} ${yy})" fill="#fff" stroke="#000"/>`;
    g += txtS(lx + 32, yy + 4.5, lab, { fs: 12.5, a: "start" }); lx += wv;
  });
  return { svg: svgOpen(W, H) + g + "</svg>", w: W, h: H };
}

/* 橫向長條圖：series = [{name, vals, fill}]；值以 fmtV 標示 */
/* 循環策略花瓣圖（量身訂製策略 7 項）：自 12 點方向順時針 1→7，花瓣長度＝評分 0–3 */
const TSG = ["", "A 避免＋D 最佳化", "B 未來價值", "B 未來價值", "B 未來價值", "C 材料價值", "C 材料價值", "C 材料價值"];

  const rad = s => r0 + (Rr - r0) * s / 3, P = (r, t) => [(cx + r * Math.cos(t)).toFixed(1), (cy + r * Math.sin(t)).toFixed(1)];
  const fill = bw ? "#A8A8A8" : "#E2A013", ink = bw ? "#000" : "#3A2A05", grid = bw ? "#777" : "#9AA3AE", edge = bw ? "#000" : "#1F2937";

    const [x0, y0] = P(r0, t0), [x1, y1] = P(R1, t0), [x2, y2] = P(R1, t1), [x3, y3] = P(r0, t1);
    g += `<path d="M${x0} ${y0} L${x1} ${y1} A${R1.toFixed(1)} ${R1.toFixed(1)} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r0.toFixed(1)} ${r0.toFixed(1)} 0 0 0 ${x0} ${y0}Z" fill="${fill}" stroke="#fff" stroke-width="2"/>`; });
  [1, 2].forEach(s => { g += `<circle cx="${cx}" cy="${cy}" r="${rad(s).toFixed(1)}" fill="none" stroke="${grid}" stroke-width="1" stroke-dasharray="4 4"/>`; });
  ts.forEach((t, i) => { const t0 = -Math.PI / 2 + i * a, [x1, y1] = P(r0, t0), [x2, y2] = P(Rr, t0); g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${grid}" stroke-width="1"/>`; });
  g += `<circle cx="${cx}" cy="${cy}" r="${Rr.toFixed(1)}" fill="none" stroke="${edge}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${r0.toFixed(1)}" fill="#fff" stroke="${edge}" stroke-width="2"/>`;
  ts.forEach((t, i) => { const tm = -Math.PI / 2 + (i + 0.5) * a, [x, y] = P(t.score ? (r0 + rad(t.score)) / 2 : (r0 + rad(1.6)) / 2 + 6, tm);

}

}

/* ---------- SVG → PNG（Word 內嵌圖片用） ---------- */
function svgToPng(svg, w, h, scale = 2) {
  return new Promise(res => {
    try {
      const img = new Image();
      img.onload = () => { try { const c = document.createElement("canvas"); c.width = w * scale; c.height = h * scale; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => { if (!b) return res(null); b.arrayBuffer().then(ab => res(new Uint8Array(ab))).catch(() => res(null)); }, "image/png"); } catch (e) { res(null); } };
      img.onerror = () => res(null);
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    } catch (e) { res(null); }
  });
}

/* ---------- PDF：分頁排版 → html2canvas 轉圖 → 自製 PDF（A4） ---------- */
